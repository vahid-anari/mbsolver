[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mbsolver"
version = "0.6.1"
description = "Fast Maxwell-Bloch solvers for masers, superradiance and coherent pulse propagation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Vahid Anari", email = "vahid.anari8@gmail.com" },
    { name = "Toktam Rashidi" },
]
keywords = [
    "maxwell-bloch", "maser", "superradiance", "physics",
    "astrophysics", "numba", "simulation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy>=1.24",
    # numba (and llvmlite) have no Intel-Mac wheels after 0.62 (0.45): newer ones would be compiled from source
    "numba>=0.58,<0.63; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numba>=0.58; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]

[project.optional-dependencies]
dev = ["build", "twine", "pytest"]

[project.urls]
Homepage = "https://github.com/vahid-anari/mbsolver"
Repository = "https://github.com/vahid-anari/mbsolver"
Issues = "https://github.com/vahid-anari/mbsolver/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
