[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "maxbloch"
version = "0.1.0"
description = "Fast Maxwell-Bloch solvers for masers, superradiance and coherent pulse propagation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vahid Anari", email = "vahid.anari8@gmail.com" }]
keywords = [
    "maxwell-bloch", "maser", "superradiance", "physics",
    "astrophysics", "numba", "simulation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy>=1.24",
    "numba>=0.58",
]

[project.optional-dependencies]
dev = ["build", "twine", "pytest"]

[project.urls]
Homepage = "https://github.com/vahid-anari/maxbloch"
Repository = "https://github.com/vahid-anari/maxbloch"
Issues = "https://github.com/vahid-anari/maxbloch/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
